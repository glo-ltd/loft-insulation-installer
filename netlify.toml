[build]
  command = "npm run build"
  publish = "dist"

# --- SEO migration: 301 redirects from old (WordPress) URLs to new paths. ---
# These MUST come before the SPA catch-all below: Netlify uses first-match-wins,
# so listing them first ensures a real 301 is issued instead of the 200 rewrite.
[[redirects]]
  from = "/sheep-wool/"
  to = "/loft-insulation/sheep-wool/"
  status = 301
  force = true

[[redirects]]
  from = "/recycled-plastic/"
  to = "/loft-insulation/recycled-plastic/"
  status = 301
  force = true

[[redirects]]
  from = "/foil/"
  to = "/loft-insulation/foil/"
  status = 301
  force = true

[[redirects]]
  from = "/conservatory/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/cookie-policy-uk/"
  to = "/cookie-policy/"
  status = 301
  force = true

[[redirects]]
  from = "/wpautoterms/privacy-policy/"
  to = "/privacy-policy/"
  status = 301
  force = true

# Single-page app: serve index.html for any unknown path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
